[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lrparser"
version = "0.1.0"
description = "A Python LR(1) shift/reduce parser generator library"
readme = "Readme.md"
requires-python = ">=3.8"
license = {text = "MIT"}

dependencies = []

[project.optional-dependencies]
dev = [
    "tox",
    "pytest>=7.0",
    "mypy",
    "pylint",
]

[tool.tox]
requires = ["tox>=4.26.0"]
env_list = ["3.13"]

[tool.tox.env_run_base]
deps = [
    "pylint",
    "mypy",
    "pytest",
]
commands = [
    ["pylint", "lrparser"],
    ["mypy", "-p", "src.lrparser"],
    ["pytest", "--log-level", "DEBUG"]
]

[tool.tox.env.tests]
commands = [
    ["pytest", "--log-level", "DEBUG", "{posargs}"]
]
