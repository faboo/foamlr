[project]
name = "foamlr"
version = "1.0.0"
authors = [
    { name="Ray Wallace III", email="rwallace3@proton.me" },
]
description = "A Python LR(1) shift/reduce parser generator library"
requires-python = ">=3.10"
readme = "Readme.md"
license-files = [ "LICENSE.txt" ]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Lesser General Public License v2 (LGPLv2)",
    "Topic :: Software Development :: Compilers",
    "Topic :: Text Processing",
    "Typing :: Typed",
]
keywords = ["parser", "parsing", "compiler"]

dependencies = []

[project.urls]
Homepage = "https://github.com/faboo/foamlr"
Repository = "https://github.com/faboo/foamlr.git"

[project.optional-dependencies]
dev = [
    "tox",
    "pytest>=7.0",
    "mypy",
    "pylint",
]

[tool.pytest.ini_options]
verbosity_assertions = "2"

[tool.tox]
requires = ["tox>=4.26.0"]
env_list = ["3.13"]

[tool.tox.env_run_base]
deps = [
    "pylint",
    "mypy",
    "pytest",
]
commands = [
    ["pylint", "foamlr"],
    ["mypy", "-p", "src.foamlr"],
    ["pytest", "--log-level", "DEBUG"]
]

[tool.tox.env.tests]
commands = [
    ["pytest", "--log-level", "DEBUG", "{posargs}"]
]

[tool.setuptools]
[tool.setuptools.package-data]
foamlr = ["py.typed"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

